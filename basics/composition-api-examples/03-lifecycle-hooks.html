<!DOCTYPE html>
<html>
<head>
	<title>Composition API - Lifecycle Hooks</title>
	<style>
		body {
			font-family: Arial, sans-serif;
			max-width: 800px;
			margin: 50px auto;
			padding: 20px;
		}
		.example {
			background: #f5f5f5;
			padding: 20px;
			margin: 20px 0;
			border-radius: 8px;
		}
		button {
			padding: 10px 20px;
			margin: 5px;
			font-size: 16px;
			cursor: pointer;
		}
		h3 {
			color: #42b883;
		}
		.lifecycle-log {
			background: #fff;
			padding: 15px;
			margin-top: 10px;
			border: 1px solid #ddd;
			border-radius: 4px;
			max-height: 300px;
			overflow-y: auto;
		}
		.log-entry {
			font-family: monospace;
			font-size: 13px;
			margin: 5px 0;
			padding: 5px;
			border-left: 3px solid #42b883;
			background: #f9f9f9;
		}
		.log-entry.mounted { border-left-color: #42b883; }
		.log-entry.updated { border-left-color: #f0ad4e; }
		.log-entry.unmounted { border-left-color: #d9534f; }
	</style>
</head>
<body>
<div id="app">
	<h1>Composition API: Lifecycle Hooks</h1>

	<div class="example">
		<h3>Lifecycle Hooks Demonstration</h3>
		<p>Counter: {{ counter }}</p>
		<button @click="counter++">Increment (triggers onUpdated)</button>
		<button @click="resetCounter">Reset</button>
		<p><small>Check the console and the log below for lifecycle events</small></p>
	</div>

	<div class="example">
		<h3>Dynamic Component (shows unmount)</h3>
		<button @click="showChild = !showChild">
			{{ showChild ? 'Hide' : 'Show' }} Child Component
		</button>
		<child-component v-if="showChild"></child-component>
	</div>

	<div class="example">
		<h3>Lifecycle Events Log</h3>
		<button @click="clearLog">Clear Log</button>
		<div class="lifecycle-log">
			<div
				class="log-entry"
				:class="log.type"
				v-for="(log, index) in lifecycleLogs"
				:key="index"
			>
				<strong>{{ log.type.toUpperCase() }}:</strong> {{ log.message }}
			</div>
		</div>
	</div>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script>
	const {
		createApp,
		ref,
		reactive,
		onBeforeMount,
		onMounted,
		onBeforeUpdate,
		onUpdated,
		onBeforeUnmount,
		onUnmounted
	} = Vue

	const app = createApp({
		setup() {
			const counter = ref(0)
			const showChild = ref(false)
			const lifecycleLogs = reactive([])

			const addLog = (type, message) => {
				const timestamp = new Date().toLocaleTimeString()
				lifecycleLogs.push({
					type,
					message: `[${timestamp}] ${message}`
				})
				console.log(`[${type.toUpperCase()}] ${message}`)
			}

			const resetCounter = () => {
				counter.value = 0
			}

			const clearLog = () => {
				lifecycleLogs.splice(0, lifecycleLogs.length)
			}

			// Lifecycle hooks in Composition API
			// These run at different stages of the component lifecycle

			onBeforeMount(() => {
				addLog('mounted', 'Component is about to be mounted (onBeforeMount)')
			})

			onMounted(() => {
				addLog('mounted', 'Component has been mounted (onMounted) - DOM is now available')
				// This is where you would typically:
				// - Fetch data from APIs
				// - Set up third-party libraries
				// - Access DOM elements
			})

			onBeforeUpdate(() => {
				addLog('updated', 'Component is about to update (onBeforeUpdate)')
			})

			onUpdated(() => {
				addLog('updated', `Component updated (onUpdated) - Counter is now ${counter.value}`)
				// This runs after any reactive data changes
			})

			onBeforeUnmount(() => {
				addLog('unmounted', 'Component is about to be unmounted (onBeforeUnmount)')
			})

			onUnmounted(() => {
				addLog('unmounted', 'Component has been unmounted (onUnmounted)')
				// This is where you would typically:
				// - Clean up timers
				// - Remove event listeners
				// - Cancel pending requests
			})

			return {
				counter,
				showChild,
				lifecycleLogs,
				resetCounter,
				clearLog
			}
		}
	})

	// Child component to demonstrate unmount
	app.component('child-component', {
		setup() {
			const childData = ref('I am a child component')
			const lifecycleLogs = reactive([])

			const addLog = (type, message) => {
				console.log(`[CHILD ${type.toUpperCase()}] ${message}`)
			}

			onMounted(() => {
				addLog('mounted', 'Child component mounted')
			})

			onBeforeUnmount(() => {
				addLog('unmounted', 'Child component about to unmount')
			})

			onUnmounted(() => {
				addLog('unmounted', 'Child component unmounted')
			})

			return {
				childData
			}
		},
		template: `
			<div style="background: #e8f5e9; padding: 15px; margin-top: 10px; border-radius: 4px;">
				<p><strong>{{ childData }}</strong></p>
				<p><small>Watch the console when this component is hidden</small></p>
			</div>
		`
	})

	app.mount('#app')
</script>

</body>
</html>
